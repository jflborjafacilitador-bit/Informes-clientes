name: Build & Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build y despliegue automático

    steps:
      # 1. Descargar el código
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Instalar dependencias
      - name: Instalar dependencias
        run: npm ci

      # 4. Compilar la aplicación
      - name: Compilar (build)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # 4.5 Debug de Estructura de Carpetas SSH
      - name: Debug Directorios SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            echo "--- PWD ---"
            pwd
            echo "--- ROOT LISTING ---"
            ls -la
            echo "--- DOMAINS LISTING ---"
            ls -la ./domains || echo "No domains dir"
            echo "--- SEARCHING PARA INDEX.HTML ---"
            find . -name "index.html"

      # 5. Instalar lftp
      - name: Instalar lftp
        run: sudo apt-get install -y lftp

      # 6. Desplegar dist/ al servidor via protocolo nativo SFTP protegido
      - name: Desplegar via SFTP a Hostinger
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          lftp -u "$SSH_USER","$SSH_PASS" sftp://$SSH_HOST:$SSH_PORT << 'SFTP_SCRIPT'
            set sftp:auto-confirm yes
            set net:timeout 120
            set net:max-retries 3
            set xfer:use-temp-file yes
            set xfer:temp-file-name *.tmp
            mirror --reverse --ignore-time --overwrite --verbose --exclude-glob *.map \
              ./dist/ ./domains/registro.residenciallosquetzales.com/public_html/
            bye
          SFTP_SCRIPT
