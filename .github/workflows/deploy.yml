name: Build & Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build y despliegue automático

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar (build)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_EVOLUTION_API_URL: ${{ secrets.VITE_EVOLUTION_API_URL }}
          VITE_EVOLUTION_API_KEY: ${{ secrets.VITE_EVOLUTION_API_KEY }}
          VITE_N8N_BASE_URL: ${{ secrets.VITE_N8N_BASE_URL }}
          VITE_N8N_API_KEY: ${{ secrets.VITE_N8N_API_KEY }}
          VITE_DEEPSEEK_API_KEY: ${{ secrets.VITE_DEEPSEEK_API_KEY }}

      - name: Instalar herramientas de despliegue
        run: sudo apt-get update -y && sudo apt-get install -y lftp openssh-client sshpass rsync

      - name: Desplegar a Hostinger
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASS: ${{ secrets.SSH_PASSWORD }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "=== 1. Verificando conexión SSH directa ==="
          sshpass -p "$SSH_PASS" ssh -v -o StrictHostKeyChecking=no -o ConnectTimeout=15 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "pwd && ls -la" 2>&1 || true

          echo "=== 2. Verificando estructura FTP con SSH_USER ==="
          lftp -u "$SSH_USER","$SSH_PASS" ftp://$SSH_HOST << 'EOF_LIST1' || true
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          pwd
          cls -la
          cls -la ..
          rm -rf ./domains
          bye
          EOF_LIST1

          echo "=== 3. Verificando estructura FTP con FTP_USER ==="
          if [ -n "$FTP_USER" ] && [ -n "$FTP_PASS" ]; then
            lftp -u "$FTP_USER","$FTP_PASS" ftp://$SSH_HOST << 'EOF_LIST2' || true
            set ssl:verify-certificate no
            set ftp:ssl-allow yes
            pwd
            cls -la
            bye
          EOF_LIST2
          fi
