name: Build & Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build y despliegue automático

    steps:
      # 1. Descargar el código
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          submodules: false

      # 2. Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. Instalar dependencias
      - name: Instalar dependencias
        run: npm ci

      # 4. Compilar la aplicación
      - name: Compilar (build)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_EVOLUTION_API_URL: ${{ secrets.VITE_EVOLUTION_API_URL }}
          VITE_EVOLUTION_API_KEY: ${{ secrets.VITE_EVOLUTION_API_KEY }}
          VITE_N8N_BASE_URL: ${{ secrets.VITE_N8N_BASE_URL }}
          VITE_N8N_API_KEY: ${{ secrets.VITE_N8N_API_KEY }}
          VITE_DEEPSEEK_API_KEY: ${{ secrets.VITE_DEEPSEEK_API_KEY }}

      # 5. Instalar lftp
      - name: Instalar lftp
        run: sudo apt-get update -y && sudo apt-get install -y lftp openssh-client

      # 6. Desplegar dist/ al servidor de Hostinger
      - name: Desplegar a Hostinger
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          echo "Desplegando a ../domains/registro.residenciallosquetzales.com/public_html/ vía FTP..."
          if lftp -u "$SSH_USER","$SSH_PASS" ftp://$SSH_HOST << 'EOF_FTP'
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set net:timeout 60
          set net:max-retries 3
          mirror --reverse --parallel=8 --transfer-all --overwrite --verbose --exclude-glob *.map \
            ./dist/ ../domains/registro.residenciallosquetzales.com/public_html/
          bye
          EOF_FTP
          then
            echo "Despliegue vía FTP completado con éxito."
            exit 0
          fi

          echo "Intentando respaldo vía SFTP..."
          lftp -u "$SSH_USER","$SSH_PASS" sftp://$SSH_HOST:$SSH_PORT << 'EOF_SFTP'
          set sftp:auto-confirm yes
          set net:timeout 60
          set net:max-retries 3
          set xfer:use-temp-file yes
          set xfer:temp-file-name *.tmp
          mirror --reverse --parallel=8 --transfer-all --overwrite --verbose --exclude-glob *.map \
            ./dist/ ./domains/registro.residenciallosquetzales.com/public_html/
          bye
          EOF_SFTP
