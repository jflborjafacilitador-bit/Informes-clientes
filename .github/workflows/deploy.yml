name: Build & Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build y despliegue automático

    steps:
      # 1. Descargar el código
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          submodules: false

      # 2. Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # 3. Instalar dependencias
      - name: Instalar dependencias
        run: npm ci

      # 4. Compilar la aplicación
      - name: Compilar (build)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_EVOLUTION_API_URL: ${{ secrets.VITE_EVOLUTION_API_URL }}
          VITE_EVOLUTION_API_KEY: ${{ secrets.VITE_EVOLUTION_API_KEY }}
          VITE_N8N_BASE_URL: ${{ secrets.VITE_N8N_BASE_URL }}
          VITE_N8N_API_KEY: ${{ secrets.VITE_N8N_API_KEY }}
          VITE_DEEPSEEK_API_KEY: ${{ secrets.VITE_DEEPSEEK_API_KEY }}

      # 5. Instalar lftp
      - name: Instalar lftp
        run: sudo apt-get update -y && sudo apt-get install -y lftp openssh-client

      # 6. Desplegar dist/ al servidor via SFTP (con respaldo FTP si SSH está inactivo en Hostinger)
      - name: Desplegar a Hostinger
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASS: ${{ secrets.SSH_PASSWORD }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          echo "Intentando despliegue vía SFTP..."
          if lftp -u "$SSH_USER","$SSH_PASS" sftp://$SSH_HOST:$SSH_PORT << 'EOF_SFTP'
          set sftp:auto-confirm yes
          set net:timeout 60
          set net:max-retries 2
          set xfer:use-temp-file yes
          set xfer:temp-file-name *.tmp
          mirror --reverse --parallel=10 --transfer-all --overwrite --verbose --exclude-glob *.map \
            ./dist/ ./domains/registro.residenciallosquetzales.com/public_html/
          bye
          EOF_SFTP
          then
            echo "Despliegue vía SFTP exitoso."
            exit 0
          fi

          echo "SFTP devolvió error de acceso. Intentando vía FTP con credenciales SSH_USER..."
          if lftp -u "$SSH_USER","$SSH_PASS" ftp://$SSH_HOST << 'EOF_FTP1'
          set ssl:verify-certificate no
          set ftp:ssl-allow yes
          set net:timeout 60
          set net:max-retries 2
          mirror --reverse --parallel=5 --transfer-all --overwrite --verbose --exclude-glob *.map \
            ./dist/ ./domains/registro.residenciallosquetzales.com/public_html/
          bye
          EOF_FTP1
          then
            echo "Despliegue vía FTP (SSH_USER) exitoso."
            exit 0
          fi

          if [ -n "$FTP_USER" ] && [ -n "$FTP_PASS" ]; then
            echo "Intentando vía FTP con FTP_USERNAME..."
            if lftp -u "$FTP_USER","$FTP_PASS" ftp://$SSH_HOST << 'EOF_FTP2'
            set ssl:verify-certificate no
            set ftp:ssl-allow yes
            set net:timeout 60
            set net:max-retries 2
            mirror --reverse --parallel=5 --transfer-all --overwrite --verbose --exclude-glob *.map \
              ./dist/ ./
            bye
          EOF_FTP2
            then
              echo "Despliegue vía FTP (FTP_USERNAME) exitoso."
              exit 0
            fi
          fi

          echo "ERROR: Hostinger rechazó el login SFTP/FTP (Login incorrect). Verifica que el acceso SSH esté Activo en el panel de Hostinger o que la contraseña SSH_PASSWORD no haya cambiado."
          exit 1
