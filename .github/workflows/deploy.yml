name: Build & Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build y despliegue automático

    steps:
      # 1. Descargar el código
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2. Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Instalar dependencias
      - name: Instalar dependencias
        run: npm ci

      # 4. Compilar la aplicación
      - name: Compilar (build)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # 5. Instalar lftp
      - name: Instalar lftp
        run: sudo apt-get install -y lftp

      # 6. Subir dist/ al servidor via FTP (modo pasivo, sin TLS)
      - name: Desplegar via FTP a Hostinger
        env:
          FTP_SERVER: 217.196.54.114
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASS" ftp://$FTP_SERVER << 'LFTP_SCRIPT'
            set ftp:passive-mode yes
            set ftp:ssl-allow no
            set ssl:verify-certificate no
            set net:timeout 60
            set net:max-retries 5
            set net:reconnect-interval-base 5
            mirror --reverse --delete --overwrite --verbose --exclude-glob *.map \
              ./dist/ /domains/registro.residenciallosquetzales.com/public_html/
            bye
          LFTP_SCRIPT
