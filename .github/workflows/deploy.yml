name: Build & Deploy to Hostinger

on:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build y despliegue automático

    steps:
      # 1. Descargar el código
      - name: Checkout del repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Instalar dependencias
      - name: Instalar dependencias
        run: npm ci

      # 4. Compilar la aplicación
      - name: Compilar (build)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_EVOLUTION_API_URL: ${{ secrets.VITE_EVOLUTION_API_URL }}
          VITE_EVOLUTION_API_KEY: ${{ secrets.VITE_EVOLUTION_API_KEY }}
          VITE_N8N_BASE_URL: ${{ secrets.VITE_N8N_BASE_URL }}
          VITE_N8N_API_KEY: ${{ secrets.VITE_N8N_API_KEY }}
          VITE_DEEPSEEK_API_KEY: ${{ secrets.VITE_DEEPSEEK_API_KEY }}

      # 5. Instalar lftp
      - name: Instalar lftp
        run: sudo apt-get update -y && sudo apt-get install -y lftp openssh-client

      # 6. Desplegar dist/ al servidor via protocolo nativo SFTP protegido
      - name: Desplegar via SFTP a Hostinger
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASS: ${{ secrets.SSH_PASSWORD }}
        run: |
          for attempt in 1 2 3; do
            echo "Intento de despliegue SFTP #$attempt..."
            if lftp -u "$SSH_USER","$SSH_PASS" sftp://$SSH_HOST:$SSH_PORT << 'SFTP_SCRIPT'
              set sftp:auto-confirm yes
              set sftp:connect-program "ssh -a -x -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=30 -o ConnectTimeout=30"
              set net:timeout 60
              set net:max-retries 4
              set net:reconnect-interval-base 5
              set net:reconnect-interval-multiplier 1
              mirror --reverse --parallel=2 --overwrite --verbose --exclude-glob *.map --exclude-glob *.tmp \
                ./dist/ ./domains/registro.residenciallosquetzales.com/public_html/
              bye
          SFTP_SCRIPT
            then
              echo "Despliegue SFTP completado con éxito."
              exit 0
            fi
            echo "Fallo en intento #$attempt, esperando 10 segundos antes de reintentar..."
            sleep 10
          done
          exit 1
